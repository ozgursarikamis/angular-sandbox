<div class="auth-container">
  <div class="auth-card">
    <app-logo></app-logo>

    <div class="auth-header">
      <h1>Reset password</h1>
      <p>Enter your username or email to receive reset instructions</p>
    </div>

    <div *ngIf="!submitted">
      <form (ngSubmit)="onSubmit()" class="auth-form">
        <div class="form-group">
          <label for="emailOrUsername">Username or Email</label>
          <input
            type="text"
            id="emailOrUsername"
            name="emailOrUsername"
            [(ngModel)]="emailOrUsername"
            placeholder="Enter your username or email"
            required
            autocomplete="username"
          />
        </div>

        <button type="submit" class="submit-btn" [disabled]="!emailOrUsername">Send Reset Link</button>
      </form>

      <div class="auth-redirect">
        Remember your password? <a routerLink="/login" class="redirect-link">Sign in</a>
      </div>
    </div>

    <div *ngIf="submitted" class="success-message">
      <div class="success-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
          <polyline points="22 4 12 14.01 9 11.01"></polyline>
        </svg>
      </div>
      <h2>Check your email</h2>
      <p>If an account exists for <strong>{{ emailOrUsername }}</strong>, you will receive password reset instructions.</p>
      <a routerLink="/login" class="back-link">Back to Sign in</a>
    </div>

    <app-social-icons></app-social-icons>
  </div>
</div>
