<div class="auth-container">
  <div class="auth-card">
    <app-logo />

    <div class="auth-header">
      <h1>Create account</h1>
      <p>Sign up to get started with your account</p>
    </div>

    <form (ngSubmit)="onSubmit()" class="auth-form">
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" [(ngModel)]="email" placeholder="Enter your email" required
          autocomplete="email" />
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <div class="password-input-wrapper">
          <input [type]="showPassword ? 'text' : 'password'" id="password" name="password" [(ngModel)]="password"
            placeholder="Create a password" required autocomplete="new-password" />
          <button type="button" class="password-toggle" (click)="togglePassword()"
            aria-label="Toggle password visibility">
            @if (showPassword) {
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path
                d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24">
              </path>
              <line x1="1" y1="1" x2="23" y2="23"></line>
            </svg>
            } @else {
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
            }
          </button>
        </div>
      </div>

      <div class="form-group">
        <label for="confirmPassword">Confirm Password</label>
        <div class="password-input-wrapper">
          <input [type]="showConfirmPassword ? 'text' : 'password'" id="confirmPassword" name="confirmPassword"
            [(ngModel)]="confirmPassword" placeholder="Confirm your password" required autocomplete="new-password"
            [class.error]="confirmPassword && !passwordsMatch" />
          <button type="button" class="password-toggle" (click)="toggleConfirmPassword()"
            aria-label="Toggle confirm password visibility">
            @if (showConfirmPassword) {
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path
                d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24">
              </path>
              <line x1="1" y1="1" x2="23" y2="23"></line>
            </svg>
            } @else {
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
            }
          </button>
        </div>
        @if (confirmPassword && !passwordsMatch) {
        <p class="error-message">
          Passwords do not match
        </p>
        }
      </div>

      <button type="submit" class="submit-btn" [disabled]="!isFormValid">Create Account</button>
    </form>

    <div class="auth-redirect">
      Already have an account? <a routerLink="/login" class="redirect-link">Sign in</a>
    </div>

    <app-social-icons />
  </div>
</div>
