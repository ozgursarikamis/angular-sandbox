<div class="title">
  Angular Sandbox {{ title ? " - " + title : "" }}
</div>

<div>
  <input type="text" [(ngModel)]="newMessage" (keyup.enter)="sendMessage()">
  <button (click)="sendMessage()">Send</button>
</div>
<div>
  <ul>
    <li #messageItem *ngFor="let msg of messages.reverse()">{{ msg }}</li>
  </ul>
</div>
