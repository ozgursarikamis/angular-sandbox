<div class="company-card">
  <div class="card-grid">
    <div class="logo-section">
      <img [src]="company.logo" [alt]="company.name + ' logo'" class="company-logo">
    </div>

    <div class="info-section">
      <h2 class="company-name">{{ company.name }}</h2>

      <div class="info-grid">
        <div class="info-item">
          <svg class="info-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
            <circle cx="12" cy="10" r="3"></circle>
          </svg>
          <div class="info-content">
            <span class="info-label">City</span>
            <span class="info-value">{{ company.city }}</span>
          </div>
        </div>

        <div class="info-item">
          <svg class="info-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect>
            <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path>
          </svg>
          <div class="info-content">
            <span class="info-label">Company Number</span>
            <span class="info-value">{{ company.companyNumber }}</span>
          </div>
        </div>

        <div class="info-item full-width">
          <svg class="info-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
            <polyline points="9 22 9 12 15 12 15 22"></polyline>
          </svg>
          <div class="info-content">
            <span class="info-label">Address</span>
            <span class="info-value">{{ company.address }}</span>
          </div>
        </div>
      </div>
    </div>

    <div class="tags-section">
      <div class="tag-group">
        <span class="tag-label">Business Areas</span>
        <div class="tags-container">
          <span *ngFor="let area of company.businessAreas" class="tag tag-blue">
            {{ area }}
          </span>
        </div>
      </div>

      <div class="tag-group">
        <span class="tag-label">Products</span>
        <div class="tags-container">
          <span *ngFor="let product of company.products" class="tag tag-green">
            {{ product }}
          </span>
        </div>
      </div>
    </div>

    <div class="action-section">
      <button class="action-button" (click)="onActionClick()">
        <svg class="button-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
          <circle cx="12" cy="12" r="3"></circle>
        </svg>
        View Details
      </button>
    </div>
  </div>
</div>
