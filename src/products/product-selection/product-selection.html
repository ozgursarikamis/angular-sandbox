<div class="content">
  <div class="title">
    {{ pageTitle }}
  </div>
</div>

<div class="grid">
  <div class="row">
    <div class="cellFull">
      <select [(ngModel)]="selectedProduct">
        <option [value]="undefined" selected>--Select a Product--</option>
        @for (product of products(); track product.id) {
          <option [ngValue]="product">{{ product.productName }}</option>
        }
        @empty {
          <option>--No Products--</option>
        }
      </select>
    </div>
  </div>
  <div class="row">
    <div class="cellLeft">
      <label for="price">Name:</label>
    </div>
    <div class="cellRight">
      {{ selectedProduct()?.productName }}
    </div>
  </div>
  <div class="row">
    <div class="cellLeft">
      <label for="price">Price:</label>
    </div>
    <div class="cellRight">
      {{ selectedProduct()?.price }}
    </div>
  </div>
  <div class="row">
    <div class="cellLeft">
      <label for="quantity">Quantity:</label>
    </div>
    <div class="cellRight">
      <input [(ngModel)]="quantity" type="number" class="quantityInput" id="quantity" placeholder="0">
    </div>
  </div>
</div>
